{% extends 'base.html' %}

{% block title %}Create Account - CodeAlpha Event Registration System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-block mb-3">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-muted small">Join CodeAlpha Event Platform</p>
                </div>

                <form method="POST" action="{% url 'signup' %}">
                    {% csrf_token %}
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control" placeholder="First Name">
                        </div>
                        <div class="col">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control" placeholder="Last Name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username *</label>
                        <input type="text" name="username" class="form-control" required placeholder="Pick a unique username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email *</label>
                        <input type="email" name="email" class="form-control" required placeholder="user@example.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password *</label>
                        <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min. 6 characters">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">
                        Already have an account? <a href="{% url 'login' %}" class="fw-semibold">Sign In</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
